<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
  <title id="title">Ayush Nandanwar — Software Engineer</title>
  <desc id="desc">Premium dark charcoal developer identity banner with editorial typography, a violet-blue gradient and a geometric orbital monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08090e"/><stop offset=".52" stop-color="#0d111b"/><stop offset="1" stop-color="#171a2b"/></linearGradient>
    <linearGradient id="violetBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset=".48" stop-color="#818cf8"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <radialGradient id="bloom"><stop offset="0" stop-color="#6254e8" stop-opacity=".28"/><stop offset=".55" stop-color="#4144b8" stop-opacity=".11"/><stop offset="1" stop-color="#22265f" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5b4fc" stop-opacity=".14"/><stop offset="1" stop-color="#60a5fa" stop-opacity=".025"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#cbd5e1" stroke-opacity=".045" stroke-width="1"/></pattern>
  </defs>

  <rect width="1440" height="480" rx="22" fill="url(#bg)"/>
