  <g fill="#dbeafe" opacity=".45"><circle cx="820" cy="104" r="2"/><circle cx="906" cy="388" r="2"/><circle cx="1318" cy="96" r="2"/><circle cx="1260" cy="390" r="2"/><circle cx="722" cy="356" r="1.5"/></g>
