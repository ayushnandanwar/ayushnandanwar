  <text x="126" y="188" fill="#f5f6fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="650" letter-spacing="-3.4">AYUSH NANDANWAR</text>
  <text x="132" y="250" fill="#b9c1d4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="550" letter-spacing="5.3">SOFTWARE ENGINEER</text>
  <path d="M132 286H520" stroke="url(#violetBlue)" stroke-width="2" stroke-linecap="round" opacity=".9"/>
  <text x="132" y="326" fill="#78849b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" letter-spacing="2.1">BACKEND  /  SYSTEMS  /  DATA</text>

