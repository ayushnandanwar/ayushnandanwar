<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Ayush Nandanwar — Backend engineering and product systems</title>
<desc id="desc">A quiet, dark editorial engineering banner with a subtle grid, connected system nodes, and a cyan accent.</desc>
<defs>
