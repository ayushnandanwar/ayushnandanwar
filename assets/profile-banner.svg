<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
  <title id="title">Ayush Nandanwar — Software Engineer</title>
  <desc id="desc">An original dark charcoal identity banner with editorial typography, violet-blue light, a precise technical grid and a custom geometric AN monogram.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08090e"/><stop offset=".53" stop-color="#0d111b"/><stop offset="1" stop-color="#181b2c"/></linearGradient>
    <linearGradient id="spectral" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c4b5fd"/><stop offset=".45" stop-color="#818cf8"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <radialGradient id="atmosphere"><stop offset="0" stop-color="#6658ee" stop-opacity=".25"/><stop offset=".6" stop-color="#4f46e5" stop-opacity=".08"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0"/></radialGradient>
    <linearGradient id="monogramGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5b4fc" stop-opacity=".16"/><stop offset="1" stop-color="#60a5fa" stop-opacity=".025"/></linearGradient>
    <pattern id="microGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#cbd5e1" stroke-opacity=".042" stroke-width="1"/></pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1440" height="440" rx="22" fill="url(#canvas)"/>
  <rect width="1440" height="440" rx="22" fill="url(#microGrid)"/>
  <ellipse cx="1080" cy="216" rx="420" ry="330" fill="url(#atmosphere)"/>
  <path d="M82 72V366" stroke="url(#spectral)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="82" cy="72" r="5" fill="#c4b5fd"/>
  <text x="126" y="177" fill="#f5f6fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="650" letter-spacing="-3.4">AYUSH NANDANWAR</text>
  <text x="132" y="238" fill="#b8c1d4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="550" letter-spacing="5.2">SOFTWARE ENGINEER</text>
  <path d="M132 273H494" stroke="url(#spectral)" stroke-width="1.8" stroke-linecap="round" opacity=".92"/>
  <text x="132" y="312" fill="#7f8ba3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" letter-spacing="2.6">BACKEND  /  SYSTEMS  /  DATA</text>

  <g transform="translate(1090 214)">
    <circle r="158" fill="url(#monogramGlass)" stroke="#a5b4fc" stroke-opacity=".18"/>
    <circle r="132" fill="none" stroke="url(#spectral)" stroke-opacity=".34" stroke-width="1.2"/>
    <circle r="104" fill="none" stroke="#c4b5fd" stroke-opacity=".22" stroke-dasharray="2 8"/>
    <ellipse rx="159" ry="62" fill="none" stroke="url(#spectral)" stroke-opacity=".42" stroke-width="1.1" transform="rotate(-34)"/>
    <ellipse rx="159" ry="62" fill="none" stroke="#93c5fd" stroke-opacity=".24" stroke-width="1.1" transform="rotate(42)"/>
    <path d="M0-158V158M-158 0H158" stroke="#a5b4fc" stroke-opacity=".12"/>
    <circle r="82" fill="#0d1220" fill-opacity=".84" stroke="url(#spectral)" stroke-opacity=".68" stroke-width="1.4"/>
    <path d="M-58 52L-28-49L2 52M-45 8H-11" fill="none" stroke="#e5e7ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15 52V-49L75 52V-49" fill="none" stroke="url(#spectral)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="-158" r="5.5" fill="#c4b5fd"/>
    <circle cx="137" cy="78" r="4.5" fill="#93c5fd"/>
    <circle cx="-127" cy="-92" r="4.5" fill="#a78bfa"/>
    <circle cx="-12" cy="129" r="4" fill="#818cf8"/>
  </g>

  <g fill="#dbeafe" opacity=".42"><circle cx="790" cy="92" r="1.8"/><circle cx="868" cy="348" r="2"/><circle cx="1298" cy="76" r="2"/><circle cx="1256" cy="365" r="1.7"/><circle cx="730" cy="320" r="1.4"/></g>
  <path d="M82 386H1358" stroke="#94a3b8" stroke-opacity=".13"/>
  <text x="132" y="416" fill="#66728a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" letter-spacing="3">ENGINEERING PROFILE</text>
  <text x="1308" y="416" fill="#66728a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" letter-spacing="2" text-anchor="end">AN / 01</text>
  <rect x="1" y="1" width="1438" height="438" rx="21" fill="none" stroke="#dbeafe" stroke-opacity=".1"/>
</svg>